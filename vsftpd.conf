# vsftpd config for Docker GPU SSH FTP container
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

chroot_local_user=YES
allow_writeable_chroot=YES

user_sub_token=$USER
local_root=/home/$USER

userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Passive mode settings
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
pasv_address=127.0.0.1

# Other settings
xferlog_enable=YES
ftpd_banner=Welcome to your container FTP server.
use_localtime=YES
seccomp_sandbox=NO
