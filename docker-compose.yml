version: "3.9"

services:
  cuda-ssh:
    build:
      context: .
      dockerfile: Dockerfile
    image: gpu-server-image
    container_name: gpu-container
    ports:
      - "2152:22"        # SSH
      - "2151:21"          # FTP
      - "21000-21010:21000-21010"  # FTP Passive ports
    runtime: nvidia
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2g
    environment:
      - USERS=${USERS}   # 定義於 .env
    volumes:
      - /mnt/d/containers/ubuntu/home:/home
    restart: unless-stopped
